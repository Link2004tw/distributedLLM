[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    health: Health endpoint tests
    query: Query endpoint tests
    gpu: GPU monitoring tests
    load: Load balancing tests
    cache: Caching tests
    slow: Slow running tests

[tool:pytest]
timeout = 120
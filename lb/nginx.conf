worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream llm_backend {
        # === ROUTING STRATEGY ===
        # Default: round_robin (no directive needed)
        # Uncomment below to switch to least_connections:
        least_conn;
        keepalive 32;

        # === WORKER NODES ===
        # NGINX auto-detects failures: 3 failed requests = mark down for 30s
        server localhost:8001 max_fails=3 fail_timeout=30s;
        server localhost:8002 max_fails=3 fail_timeout=30s;
        server localhost:8003 max_fails=3 fail_timeout=30s;
        server localhost:8004 max_fails=3 fail_timeout=30s;
        server localhost:8005 max_fails=3 fail_timeout=30s;
        server localhost:8006 max_fails=3 fail_timeout=30s;
        server localhost:8007 max_fails=3 fail_timeout=30s;
        server localhost:8008 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;
        server_name localhost;

        location /query {
            proxy_pass http://llm_backend/query;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /health {
            return 200 "OK\n";
        }

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}

worker_processes auto;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    upstream llm_backend {
        # === ROUTING STRATEGY ===
        # Default: round_robin (no directive needed)
        # Uncomment below to switch to least_connections:
        # least_conn;

        # === WORKER NODES ===
        # Tolerant failure detection under high concurrency
        server localhost:8001 max_fails=10 fail_timeout=60s;
        server localhost:8002 max_fails=10 fail_timeout=60s;
        server localhost:8003 max_fails=10 fail_timeout=60s;
        server localhost:8004 max_fails=10 fail_timeout=60s;
    }

    server {
        listen 8000 backlog=4096;
        server_name localhost;

        location /query {
            proxy_pass http://llm_backend/query;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_connect_timeout 30s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 5;
            proxy_ignore_client_abort on;
        }

        location /health {
            return 200 "OK\n";
        }

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}
